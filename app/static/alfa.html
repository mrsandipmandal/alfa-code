<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alfa-Code Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            echoDark: '#0e0f14',
            echoCard: '#15161e',
            echoBorder: '#232530',
            echoTextMuted: '#717585',
            echoGlow: '#9b5de5',
          },
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #252836; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3b3f54; }
    .top-right-light {
      position: absolute; top: -60px; right: -40px; width: 580px; height: 650px;
      pointer-events: none;
      background: radial-gradient(ellipse at 85% 10%, rgba(184, 134, 255, 0.42) 0%, rgba(147, 85, 245, 0.22) 32%, rgba(103, 44, 214, 0.08) 60%, transparent 80%);
      filter: blur(48px); transform: rotate(-16deg) scale(1.1); z-index: 1;
    }
    .orb-glow {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(175, 110, 255, 0.35) 0%, rgba(138, 58, 240, 0.12) 55%, transparent 75%);
      filter: blur(28px); pointer-events: none;
    }
    .glowing-input-box {
      border: 1px solid rgba(168, 85, 247, 0.36);
      box-shadow: 0 0 24px -4px rgba(168, 85, 247, 0.22), inset 0 0 16px -6px rgba(168, 85, 247, 0.14);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glowing-input-box:focus-within {
      border-color: rgba(192, 132, 252, 0.7);
      box-shadow: 0 0 32px 0px rgba(168, 85, 247, 0.36), inset 0 0 20px -4px rgba(168, 85, 247, 0.24);
    }
    .suggestion-card {
      background: rgba(22, 23, 31, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      transition: all 0.22s ease-in-out;
    }
    .suggestion-card:hover {
      background: rgba(30, 32, 45, 0.85);
      border-color: rgba(168, 85, 247, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.45);
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }
    .animate-float { animation: floatOrb 5s ease-in-out infinite; }
    @keyframes wavePulse { 0%, 100% { height: 6px; } 50% { height: 16px; } }
    .wave-bar:nth-child(1) { animation: wavePulse 1.1s ease-in-out infinite; }
    .wave-bar:nth-child(2) { animation: wavePulse 1.1s ease-in-out 0.2s infinite; }
    .wave-bar:nth-child(3) { animation: wavePulse 1.1s ease-in-out 0.4s infinite; }
    .wave-bar:nth-child(4) { animation: wavePulse 1.1s ease-in-out 0.1s infinite; }
    .alfa-result pre {
      background: #0a0b10; border: 1px solid #232530; border-radius: 12px;
      padding: 12px; overflow-x: auto; font-size: 12px; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
    }
    .alfa-result details { border: 1px solid #232530; border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; }
    .alfa-result summary { cursor: pointer; color: #9ca1b5; font-size: 12px; }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="bg-[#111217] text-[#ebecee] min-h-screen flex items-center justify-center p-2 sm:p-5 select-none antialiased overflow-hidden font-sans">

  <div class="relative w-full max-w-[1400px] h-[92vh] max-h-[920px] bg-[#0c0d12] rounded-[34px] border-[5px] border-[#181922] shadow-[0_25px_70px_rgba(0,0,0,0.85)] flex overflow-hidden">

    <div class="top-right-light"></div>
    <div class="absolute -top-24 right-1/4 w-96 h-96 bg-purple-900/20 blur-[100px] pointer-events-none z-0"></div>

    <!-- LEFT SIDEBAR -->
    <aside class="relative z-10 w-64 md:w-[268px] flex-shrink-0 flex flex-col border-r border-[#1a1b24] bg-[#0c0d12]/95 backdrop-blur-md">

      <div class="px-5 pt-5 pb-3 flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-purple-700 via-indigo-600 to-purple-400 p-[1.5px] shadow-[0_0_12px_rgba(168,85,247,0.4)] flex items-center justify-center">
            <div class="w-full h-full bg-[#0d0e15] rounded-full flex items-center justify-center relative overflow-hidden">
              <div class="absolute inset-0 bg-gradient-to-br from-purple-500/40 via-transparent to-indigo-500/20"></div>
              <span class="text-[13px] font-bold text-purple-300 relative">A</span>
            </div>
          </div>
          <span class="font-semibold text-[15px] tracking-tight text-white/95">Alfa</span>
        </div>
      </div>

      <div class="px-4 py-2">
        <button id="btnNewChat" class="w-full py-2 px-3 rounded-lg border border-[#262835] bg-[#14161f]/80 hover:bg-[#1a1c28] text-xs font-medium text-white/90 flex items-center justify-center space-x-2 transition-all duration-150 hover:border-purple-500/40">
          <span class="tracking-wide">+ New Chat</span>
        </button>
      </div>

      <div class="px-4 py-1 space-y-0.5 text-xs text-[#8c909e] font-medium">
        <a href="javascript:void(0)" onclick="setMode('code')" class="flex items-center space-x-2.5 px-2.5 py-1.5 rounded-md hover:bg-white/[0.04] text-white/90">
          <span>Code</span>
        </a>
        <a href="javascript:void(0)" onclick="setMode('image')" class="flex items-center space-x-2.5 px-2.5 py-1.5 rounded-md hover:bg-white/[0.04] text-[#8c909e] hover:text-white transition-colors">
          <span>Images</span>
        </a>
        <a href="javascript:void(0)" onclick="setMode('video')" class="flex items-center space-x-2.5 px-2.5 py-1.5 rounded-md hover:bg-white/[0.04] text-[#8c909e] hover:text-white transition-colors">
          <span>Videos</span>
        </a>
      </div>

      <div class="flex-1 overflow-y-auto px-4 py-2 space-y-4 text-[11px] font-normal tracking-wide">
        <div>
          <div class="text-[10px] font-semibold text-[#575a68] uppercase tracking-wider mb-1.5">
            <span>Today</span>
          </div>
          <ul id="historyList" class="space-y-1"></ul>
        </div>
      </div>

      <div class="px-3.5 pb-2.5">
        <div class="p-3 rounded-xl bg-[#14151e]/80 border border-[#232535] relative overflow-hidden">
          <div class="flex items-center space-x-2.5 mb-1.5">
            <span id="engineDot" class="w-2 h-2 rounded-full bg-gray-500"></span>
            <span id="engineLabel" class="text-xs font-semibold text-white/95 tracking-wide">Engine: ...</span>
          </div>
          <p id="engineSub" class="text-[10px] leading-tight text-[#757989] mb-2.5">Connecting...</p>
        </div>
      </div>

      <div class="px-4 py-3 border-t border-[#1a1b24] flex items-center justify-between">
        <div class="flex items-center space-x-2.5">
          <div class="w-7 h-7 rounded-full overflow-hidden border border-[#2a2d3c] bg-gradient-to-tr from-purple-700 to-indigo-500 flex items-center justify-center text-xs font-bold text-white">U</div>
          <span class="text-xs font-medium text-white/90">User</span>
        </div>
      </div>
    </aside>

    <!-- MAIN INTERFACE -->
    <main class="relative z-10 flex-1 flex flex-col justify-between p-6 md:p-9 overflow-y-auto">

      <div class="w-full flex justify-end"></div>

      <div class="w-full max-w-[840px] mx-auto flex flex-col items-center justify-center my-auto pt-2">

        <div class="relative mb-5 flex items-center justify-center">
          <div class="orb-glow"></div>
          <div class="relative w-14 h-14 rounded-full p-[2px] bg-gradient-to-tr from-purple-600 via-fuchsia-500 to-indigo-400 shadow-[0_0_35px_rgba(168,85,247,0.55)] animate-float flex items-center justify-center">
            <div class="w-full h-full rounded-full bg-[#111219] flex items-center justify-center relative overflow-hidden shadow-inner">
              <div class="absolute inset-0 rounded-full border border-purple-300/40 transform -rotate-45 scale-90"></div>
              <span class="text-xl font-bold text-purple-200" style="text-shadow: 0 0 8px rgba(216,180,254,0.9)">A</span>
            </div>
          </div>
        </div>

        <div class="text-center space-y-1 mb-8">
          <p class="text-xs md:text-sm font-medium text-[#7d8296] tracking-tight">Welcome to Alfa AI</p>
          <h1 class="text-2xl md:text-4xl font-semibold tracking-tight text-[#f1f2f6]">How Can I Assist You?</h1>
        </div>

        <div class="w-full grid grid-cols-1 md:grid-cols-3 gap-3.5">
          <div onclick="selectPrompt('Write a Python function that sorts a list')" class="suggestion-card rounded-2xl p-4 cursor-pointer flex flex-col justify-between min-h-[96px]">
            <p class="text-xs font-normal text-[#9ca1b5] leading-relaxed">Write a Python function that sorts a list</p>
            <div class="pt-2 text-[#5a5e72] text-xs">Code</div>
          </div>
          <div onclick="selectPrompt('Explain this code snippet:\n')" class="suggestion-card rounded-2xl p-4 cursor-pointer flex flex-col justify-between min-h-[96px]">
            <p class="text-xs font-normal text-[#9ca1b5] leading-relaxed">Explain this code snippet</p>
            <div class="pt-2 text-[#5a5e72] text-xs">Explain</div>
          </div>
          <div onclick="selectPrompt('Find and fix the bug in this code:\n')" class="suggestion-card rounded-2xl p-4 cursor-pointer flex flex-col justify-between min-h-[96px]">
            <p class="text-xs font-normal text-[#9ca1b5] leading-relaxed">Find and fix the bug in this code</p>
            <div class="pt-2 text-[#5a5e72] text-xs">Debug</div>
          </div>
        </div>

        <div id="resultArea" class="alfa-result w-full mt-4 hidden rounded-2xl p-4 text-xs text-[#cfd2dd] leading-relaxed" style="background:rgba(22,23,31,0.65);border:1px solid rgba(255,255,255,0.06)"></div>

      </div>

      <div class="w-full max-w-[840px] mx-auto mt-6">
        <div class="glowing-input-box rounded-2xl bg-[#14151e]/85 backdrop-blur-xl p-3.5 flex flex-col space-y-3">

          <div class="flex items-center space-x-2.5 px-1">
            <input
              id="promptInput"
              type="text"
              placeholder="Ask AI anything or write your request..."
              class="w-full bg-transparent text-xs sm:text-sm text-[#e6e8ee] placeholder-[#575a6c] focus:outline-none"
            />
          </div>

          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center space-x-2 text-[#717586]">
              <span id="attachName" class="text-[11px] text-[#575a6c]"></span>
              <input id="fileInput" type="file" class="hidden" />
            </div>

            <div class="flex items-center space-x-2">
              <div class="relative inline-block text-left" id="modelDropdownContainer">
                <button id="modelSelectBtn" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-[#1b1c26] border border-[#2b2d3d] text-xs font-medium text-white/90 hover:border-purple-500/40 transition-colors">
                  <span id="currentModelLabel" class="text-[11px] text-[#cfd2dd]">tiny-50M</span>
                  <span class="text-[#777b8d] text-[10px]">v</span>
                </button>
                <div id="modelDropdownMenu" class="hidden absolute right-0 bottom-full mb-2 w-44 rounded-xl bg-[#171822] border border-[#2a2c3d] shadow-2xl py-1 z-30 text-xs">
                  <button onclick="changeModel('tiny-50M', 256)" class="w-full text-left px-3 py-1.5 hover:bg-white/[0.06] text-white">tiny-50M</button>
                  <button onclick="changeModel('tiny-50M-long', 512)" class="w-full text-left px-3 py-1.5 hover:bg-white/[0.06] text-[#9ca1b5]">tiny-50M-long</button>
                </div>
              </div>

              <button id="attachBtn" title="Attach file" class="p-1.5 text-[#73778a] hover:text-white rounded hover:bg-white/[0.04] transition-colors text-sm">+</button>

              <button id="sendBtn" title="Generate" class="h-8 px-4 rounded-lg bg-[#181926] border border-purple-500/50 shadow-[0_0_12px_rgba(168,85,247,0.35)] flex items-center justify-center hover:border-purple-400 transition-all text-xs font-semibold text-purple-200">
                <span id="sendLabel">Generate</span>
              </button>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <script>
    let maxTokens = 256;
    let attachedFile = null;
    let exchanges = JSON.parse(localStorage.getItem('alfa_chats') || '[]');

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function renderMd(md) {
      // minimal markdown: ``` fences -> <pre>, <details> passthrough
      let h = esc(md);
      h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => '<pre>' + code + '</pre>');
      h = h.replace(/\n/g, '<br>');
      // allow our backend <details> blocks (escape then restore)
      h = h.replace(/&lt;details&gt;/g, '<details>').replace(/&lt;\/details&gt;/g, '</details>')
           .replace(/&lt;summary&gt;/g, '<summary>').replace(/&lt;\/summary&gt;/g, '</summary>');
      return h;
    }

    function renderHistory() {
      const ul = document.getElementById('historyList');
      if (!exchanges.length) { ul.innerHTML = '<li class="text-[#575a68] px-1.5">No chats yet.</li>'; return; }
      ul.innerHTML = exchanges.slice(-8).reverse().map((e, i) =>
        `<li onclick="loadExchange(${exchanges.length - 1 - i})" class="py-1 px-1.5 rounded hover:bg-white/[0.04] cursor-pointer text-[#7a7e8e] hover:text-white transition-colors truncate">${esc((e.prompt || '').slice(0, 34))}</li>`
      ).join('');
    }
    function loadExchange(i) {
      const e = exchanges[i];
      if (!e) return;
      document.getElementById('promptInput').value = e.prompt;
      showResult(e.markdown);
    }
    function saveExchange(prompt, markdown) {
      exchanges.push({ prompt, markdown, t: Date.now() });
      localStorage.setItem('alfa_chats', JSON.stringify(exchanges.slice(-50)));
      renderHistory();
    }

    function selectPrompt(t) {
      const input = document.getElementById('promptInput');
      input.value = t; input.focus();
    }
    function setMode(m) {
      const map = { code: 'Write a Python function that ', image: 'Describe the attached image and write code for it:\n', video: 'Describe this clip, then write code to render it:\n' };
      selectPrompt(map[m] || '');
    }

    const modelBtn = document.getElementById('modelSelectBtn');
    const modelMenu = document.getElementById('modelDropdownMenu');
    const modelLabel = document.getElementById('currentModelLabel');
    modelBtn.addEventListener('click', (e) => { e.stopPropagation(); modelMenu.classList.toggle('hidden'); });
    function changeModel(name, tokens) {
      modelLabel.textContent = name; maxTokens = tokens;
      modelMenu.classList.add('hidden');
    }
    document.addEventListener('click', () => { modelMenu.classList.add('hidden'); });

    document.getElementById('attachBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', (e) => {
      attachedFile = e.target.files[0] || null;
      document.getElementById('attachName').textContent = attachedFile ? attachedFile.name : '';
    });

    function showResult(html) {
      const box = document.getElementById('resultArea');
      box.classList.remove('hidden');
      box.innerHTML = html;
      box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function submit() {
      const input = document.getElementById('promptInput');
      const prompt = input.value.trim();
      if (!prompt) return;
      document.getElementById('sendLabel').textContent = '...';
      showResult('<span class="text-[#8a8a93]">Thinking...</span>');
      try {
        let res;
        if (attachedFile) {
          const fd = new FormData();
          fd.append('prompt', prompt);
          fd.append('max_tokens', maxTokens);
          fd.append('file', attachedFile);
          res = await fetch('/api/generate', { method: 'POST', body: fd });
        } else {
          res = await fetch('/api/generate', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt, max_tokens: maxTokens }),
          });
        }
        const data = await res.json();
        const html = `<div class="text-[#575a68] text-[11px] mb-1">engine: ${esc(data.engine || '?')}</div>` + renderMd(data.markdown || '(empty)');
        showResult(html);
        saveExchange(prompt, data.markdown || '');
        input.value = '';
        attachedFile = null;
        document.getElementById('attachName').textContent = '';
        document.getElementById('fileInput').value = '';
      } catch (err) {
        showResult('<span class="text-red-400">Request failed: ' + esc(String(err)) + '</span>');
      }
      document.getElementById('sendLabel').textContent = 'Generate';
    }
    document.getElementById('sendBtn').addEventListener('click', submit);
    document.getElementById('promptInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });

    document.getElementById('btnNewChat').addEventListener('click', () => {
      document.getElementById('promptInput').value = '';
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('promptInput').focus();
    });

    fetch('/api/status').then(r => r.json()).then(d => {
      document.getElementById('engineLabel').textContent = 'Engine: ' + d.mode;
      document.getElementById('engineSub').textContent = d.device + (d.reason ? ' — ' + d.reason : '');
      document.getElementById('engineDot').className = 'w-2 h-2 rounded-full ' + (d.mode === 'mock' ? 'bg-yellow-500' : 'bg-green-500');
    }).catch(() => {
      document.getElementById('engineLabel').textContent = 'Engine: offline';
    });

    renderHistory();
  </script>
</body>
</html>
