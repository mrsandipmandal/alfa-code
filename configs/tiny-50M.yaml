# Tiny demo config - fits RTX 3050 4GB (short ctx) / Colab T4 16GB (long ctx).
# High-context: max_seq_len 8192 + RoPE theta 500k. For 16k/32k raise both
# and lower batch_size to 1 with grad_accum 16 + gradient_checkpointing.
model:
  arch: llama
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  num_kv_heads: 4
  intermediate_size: 1376
  vocab_size: 32000
  max_seq_len: 8192
  rope_theta: 500000.0
tokenizer:
  type: bpe
  vocab_size: 32000
  train_files: data/processed/train.jsonl
multimodal:
  vision_encoder: openai/clip-vit-base-patch32
  projector_hidden: 512
  image_tokens: 256        # <image> placeholder count per image
  video_frames: 4          # <video> placeholders per clip
  video_tokens_per_frame: 64
context:
  max_seq_len: 8192       # must match model.max_seq_len
  max_prompt_chars: 24000  # ~6k tokens, must match download_data.py
  max_answer_chars: 24000
  truncation: right        # right | left (keep tail for code completion)
  gradient_checkpointing: true
training:
  batch_size: 1           # 1 for 8k ctx on T4; use 2 only for <=2k ctx
  grad_accum: 8
  lr: 3e-4
  epochs: 1
  output_dir: outputs/tiny-50M
gguf:
  quant: Q4_K_M
  out_file: outputs/tiny-50M.gguf
